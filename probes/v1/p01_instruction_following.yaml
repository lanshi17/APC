probe_id: p01_instruction_following
name: 单指令遵循
category: instruction_following
version: 1.0.0

input:
  prompt: |
    请将下面这句话翻译成英文。
    只输出英文，不要解释。
    句子：今天市场波动较大。

expected:
  contains_any:
  - market
  - volatility
  - volatile
  forbidden:
  - 解释
  - 翻译如下

metrics:
  - only_target_language
  - no_explanation
