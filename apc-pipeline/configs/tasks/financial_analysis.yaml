task_id: financial_report_analysis_v1
name: 财务报告分析
version: 1.0.0
objective: |
  根据输入的公司财务报告，分析公司的财务表现、识别关键指标变化，并输出结构化结论。
input:
  type: document
  format: text
  max_tokens: 20000
  language: zh
output:
  type: json
  strict: true
  schema:
    summary: string
    metrics:
      type: array
      items:
        name: string
        value: string
        change: string
        comment: string
    risks:
      type: array
      items: string
    confidence: number
constraints:
  - 不得虚构输入中不存在的数据
  - 所有关键结论必须能追溯到输入材料
  - 如果信息不足，必须明确说明
  - 风险因素至少输出 3 条，若不足则说明原因
reasoning:
  required: true
  visibility: hidden
quality_weights:
  accuracy: 0.50
  instruction_following: 0.20
  format: 0.15
  robustness: 0.10
  efficiency: 0.05
cost_limits:
  max_input_tokens: 25000
  max_output_tokens: 2000
  max_latency_ms: 15000
evaluation:
  gold_set_required: true
  perturbation_required: true
  judge_model_separate: true
